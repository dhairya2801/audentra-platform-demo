name: Platform CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: platform-ci-${{ github.ref }}
  # Keep main deployments serialized to completion. Pull-request superseding
  # commits may still cancel obsolete validation runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: FastAPI, worker, and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: vv_enrollment
          POSTGRES_USER: vv
          POSTGRES_PASSWORD: vv_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vv -d vv_enrollment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUDENTRA_ENV: test
      AUTH_MODE: demo
      DATABASE_URL: postgresql://vv:vv_ci_password@localhost:5432/vv_enrollment
      TEST_DATABASE_URL: postgresql://vv:vv_ci_password@localhost:5432/vv_enrollment
      AUDENTRA_TEST_DATABASE_URL: postgresql://vv:vv_ci_password@localhost:5432/vv_enrollment
      AUDENTRA_TEST_TENANT_ID: 00000000-0000-7000-8000-000000000001
      AUDENTRA_TEST_STUDENT_ID: 00000000-0000-7000-8000-000000000101
      AUDENTRA_TEST_S3_ENDPOINT: http://localhost:9000
      AUDENTRA_TEST_S3_BUCKET: vv-documents
      AUDENTRA_TEST_S3_ACCESS_KEY: vv_minio
      AUDENTRA_TEST_S3_SECRET_KEY: vv_minio_password
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: vv-documents
      OBJECT_STORAGE_ACCESS_KEY: vv_minio
      OBJECT_STORAGE_SECRET_KEY: vv_minio_password
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.7.12

      - name: Synchronize the locked Python environment
        run: uv sync --directory apps/api --locked --all-groups

      - name: Start the pinned MinIO integration service
        run: |
          docker run --detach --rm --name audentra-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=vv_minio \
            --env MINIO_ROOT_PASSWORD=vv_minio_password \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs audentra-ci-minio
              exit 1
            fi
            sleep 1
          done
          uv run --directory apps/api --locked python -c \
            "import boto3,os; boto3.client('s3', endpoint_url=os.environ['OBJECT_STORAGE_ENDPOINT'], region_name=os.environ['OBJECT_STORAGE_REGION'], aws_access_key_id=os.environ['OBJECT_STORAGE_ACCESS_KEY'], aws_secret_access_key=os.environ['OBJECT_STORAGE_SECRET_KEY']).create_bucket(Bucket=os.environ['OBJECT_STORAGE_BUCKET'])"

      - name: Check formatting and lint
        run: |
          uv run --directory apps/api --locked ruff format --check src tests
          uv run --directory apps/api --locked ruff check src tests

      - name: Run strict static type checks
        run: uv run --directory apps/api --locked mypy src tests

      - name: Apply immutable SQL migrations
        run: >-
          uv run --directory apps/api --locked
          audentra-migrate --migrations-dir migrations

      - name: Seed deterministic compatibility data
        run: uv run --directory apps/api --locked audentra-seed --all

      - name: Run unit, contract, integration, and coverage tests
        run: >-
          uv run --directory apps/api --locked pytest
          --cov=audentra
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Enforce critical runtime coverage
        run: >-
          uv run --directory apps/api --locked coverage report
          --include="*/audentra/application/platform_service.py,*/audentra/bootstrap/*.py,*/audentra/core/*.py,*/audentra/domain/*.py,*/audentra/infrastructure/documents/processing.py,*/audentra/infrastructure/messaging/catalog.py,*/audentra/infrastructure/messaging/dispatcher.py,*/audentra/infrastructure/messaging/envelope.py,*/audentra/infrastructure/postgres/postgres_service.py,*/audentra/infrastructure/storage/s3.py,*/audentra/infrastructure/worker/*.py,*/audentra/integrations/ai/*.py,*/audentra/interfaces/http/*.py,*/audentra/interfaces/worker/*.py"
          --fail-under=79

  node:
    name: Remaining Node contracts and tools
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"

      - name: Install retained preprocessing test runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --requirement packages/document-preprocessing/requirements.txt
          python -m pip check

      - name: Install locked Node dependencies
        run: npm ci

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --workspaces

      - name: Validate remaining Node packages
        run: |
          npm run typecheck:node
          npm run test:node
          npm run crm:graph:check
          npm run build:node

  container:
    name: Production Python image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - python
      - node

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the locked non-root runtime image
        run: >-
          docker build
          --file infra/docker/api.Dockerfile
          --tag audentra-platform:test
          .

      - name: Verify all Python process entry points
        run: |
          docker run --rm --entrypoint python audentra-platform:test -c \
            "import shutil; names=('audentra-api','audentra-worker','audentra-migrate','audentra-seed'); assert all(shutil.which(name) for name in names)"
          test "$(docker image inspect audentra-platform:test --format '{{.Config.User}}')" = "audentra"

  deploy-preview:
    name: Deploy Vekend Cloud Run preview
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: preview
    concurrency:
      group: audentra-platform-cloud-run-preview
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: audentra
      GCP_REGION: us-central1
      ARTIFACT_REPOSITORY: audentra-platform
      ARTIFACT_IMAGE: api
      API_SERVICE: audentra-api-preview
      MIGRATION_JOB: audentra-migrate-preview
      SEED_JOB: audentra-seed-preview
      WORKER_JOB: audentra-worker-once-preview
      SCHEDULER_JOB: audentra-worker-dispatch-preview
      RUNTIME_SERVICE_ACCOUNT: audentra-platform-runtime@audentra.iam.gserviceaccount.com
      SCHEDULER_SERVICE_ACCOUNT: audentra-platform-scheduler@audentra.iam.gserviceaccount.com
      CLOUD_SQL_INSTANCE: audentra:us-central1:audentra-preview-postgres
      GCS_BUCKET: audentra-906906351296-preview-documents
      DATABASE_URL_SECRET: audentra-preview-database-url
      DOCUMENT_WORKER_TOKEN_SECRET: audentra-preview-document-worker-token
      STAFF_INVITATION_CODE_SECRET: audentra-preview-staff-invitation-code
      # Optional for the synthetic preview. Set this environment variable to
      # audentra-preview-openrouter-api-key after a Vekend-owned key is stored.
      OPENROUTER_API_KEY_SECRET: ${{ vars.OPENROUTER_API_KEY_SECRET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/906906351296/locations/global/workloadIdentityPools/github-audentra/providers/github
      GCP_SERVICE_ACCOUNT: audentra-platform-cd@audentra.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: google-auth
        name: Exchange GitHub OIDC token for short-lived Vekend credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable platform image
        run: |
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${ARTIFACT_IMAGE}:${GITHUB_SHA}"
          if gcloud artifacts docker images describe "${image_uri}" --quiet >/dev/null 2>&1; then
            echo "Immutable platform image already exists; reusing ${image_uri}."
          else
            docker build \
              --file infra/docker/api.Dockerfile \
              --tag "${image_uri}" \
              .
            docker push "${image_uri}"
          fi
          echo "IMAGE_URI=${image_uri}" >>"${GITHUB_ENV}"

      - name: Migrate, seed, deploy API, and configure bounded worker jobs
        run: bash infra/cloud-run/deploy-preview.sh

      - name: Verify the deployed Cloud Run revision
        run: |
          ready="$(gcloud run services describe "${API_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.conditions[?type=Ready].status)')"
          test "${ready}" = "True"
          deployed_image="$(gcloud run services describe "${API_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(spec.template.spec.containers[0].image)')"
          test "${deployed_image}" = "${IMAGE_URI}"
