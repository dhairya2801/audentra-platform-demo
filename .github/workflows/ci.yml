name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vv_enrollment
          POSTGRES_USER: vv
          POSTGRES_PASSWORD: vv_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vv -d vv_enrollment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vv:vv_ci_password@localhost:5432/vv_enrollment
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      DEMO_TENANT_ID: 00000000-0000-7000-8000-000000000001
      DEMO_STUDENT_ID: 00000000-0000-7000-8000-000000000101

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/demo-api/package-lock.json

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install bounded PDF preprocessing runtime
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --requirement packages/document-preprocessing/requirements.txt
          python -m pip check

      - name: Install workspace dependencies
        run: npm ci

      - name: Install stateful preview API
        run: npm --prefix tools/demo-api ci --workspaces=false

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --workspaces
          npm --prefix tools/demo-api audit --omit=dev --workspaces=false

      - name: Apply database migrations
        run: npm --prefix apps/api run db:migrate

      - name: Seed deterministic scenario
        run: npm --prefix apps/api run db:seed

      - name: Typecheck contracts
        run: npm --prefix packages/contracts run typecheck

      - name: Validate document preprocessing
        run: npm --prefix packages/document-preprocessing test

      - name: Validate CRM Change Graph
        run: |
          npm --prefix packages/state-effects run typecheck
          npm --prefix packages/state-effects test
          npm --prefix packages/state-effects run generate:check

      - name: Typecheck and test API
        run: |
          npm --prefix apps/api run typecheck
          npm --prefix apps/api test

      - name: Typecheck and test worker
        run: |
          npm --prefix apps/worker run typecheck
          npm --prefix apps/worker test

      - name: Validate web
        run: |
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run lint
          npm --prefix apps/web test

      - name: Validate stateful preview API
        run: npm --prefix tools/demo-api test

      - name: Build API and worker
        run: |
          npm --prefix apps/api run build
          npm --prefix apps/worker run build

  deploy-preview:
    name: Deploy hardened VM preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: vv-edgent-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: even-advantage-502610-n1
      GCP_ZONE: us-central1-a
      GCP_INSTANCE: deneme-harness
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/39355369148/locations/global/workloadIdentityPools/github-vv-edgent/providers/github
      GCP_SERVICE_ACCOUNT: vv-edgent-cd@even-advantage-502610-n1.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: google-auth
        name: Exchange GitHub OIDC token for short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Create immutable source release
        run: >-
          git archive
          --format=tar.gz
          --output="${RUNNER_TEMP}/vv-edgent-${GITHUB_SHA}.tar.gz"
          "${GITHUB_SHA}"

      - name: Upload release through IAP
        run: >-
          gcloud compute scp
          "${RUNNER_TEMP}/vv-edgent-${GITHUB_SHA}.tar.gz"
          "${GCP_INSTANCE}:/tmp/vv-edgent-${GITHUB_SHA}.tar.gz"
          --project="${GCP_PROJECT_ID}"
          --zone="${GCP_ZONE}"
          --tunnel-through-iap
          --quiet

      - name: Deploy and health-check release
        run: >-
          gcloud compute ssh
          "${GCP_INSTANCE}"
          --project="${GCP_PROJECT_ID}"
          --zone="${GCP_ZONE}"
          --tunnel-through-iap
          --quiet
          --command="sudo /usr/local/sbin/vv-edgent-deploy ${GITHUB_SHA}"
