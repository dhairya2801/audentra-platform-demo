# One disposable shared demo, restored from a frozen database on explicit reset.
# Compose with compose.yaml; see docs/integration/demo-reset.md.
services:
  postgres:
    mem_limit: 512m
  api:
    mem_limit: 768m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${DEMO_DATABASE_NAME:?Set a dedicated audentra_demo_ database}
      DEMO_RESET_TEMPLATE: ${DEMO_DATABASE_NAME}_baseline
      OBJECT_STORAGE_BUCKET: ${DEMO_STORAGE_BUCKET:?Set the dedicated demo bucket}
      DEMO_TENANT_ID: 00000000-0000-7000-8000-000000000003
      DEMO_STUDENT_ID: 3bedfe91-6802-4937-893b-72cb7779ecfa
      DEMO_ACTOR_ID: 3bedfe91-6802-4937-893b-72cb7779ecfa
      DEMO_STAFF_ACTOR_ID: 01973261-954a-5019-8e9e-24a699abea7b
      DEMO_STUDENT_ALLOWLIST: SYN-000061
      DEMO_STAFF_ALLOWLIST: AU-55ff7e408818
      OPENAI_MODEL: gpt-5.6-luna
      EDWARD_READ_PLANNER: model
      ASSISTANT_TRACE_DEBUG_ENABLED: "true"
  worker:
    profiles: [background-workers]
    environment:
      DEMO_RESET_TEMPLATE: ${DEMO_DATABASE_NAME}_baseline
