name: audentra-platform

x-python-service: &python-service
  image: audentra-platform-python:local
  build:
    context: ..
    dockerfile: infra/docker/api.Dockerfile
  init: true

x-runtime-environment: &runtime-environment
  AUDENTRA_ENV: development
  AUTH_MODE: demo
  BROWSER_AUTH_REQUIRED: ${BROWSER_AUTH_REQUIRED:-true}
  API_HOST: 0.0.0.0
  API_PORT: "4000"
  WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-vv}:${POSTGRES_PASSWORD:-vv_local_password}@postgres:5432/${POSTGRES_DB:-vv_enrollment}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-vv-documents}
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vv_minio}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vv_minio_password}
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-10485760}
  ONBOARDING_DOCUMENT_TEMPLATE_DIR: /workspace/apps/api/assets/onboarding
  DOCUMENT_WORKER_TOKEN: ${DOCUMENT_WORKER_TOKEN:-local-development-document-worker-token}
  API_INTERNAL_URL: http://api:4000
  DEMO_TENANT_ID: 00000000-0000-7000-8000-000000000001
  DEMO_STUDENT_ID: 00000000-0000-7000-8000-000000000101
  DEMO_ACTOR_ID: 00000000-0000-7000-8000-000000000100
  DEMO_STAFF_ACTOR_ID: 00000000-0000-7000-8000-000000000901
  VV_STAFF_INVITATION_CODE: ${VV_STAFF_INVITATION_CODE:-local-staff-invitation-2027}
  WORKER_ID: ${WORKER_ID:-compose-worker}
  WORKER_CONSUMER_NAME: ${WORKER_CONSUMER_NAME:-student-dashboard-v1}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-10}
  WORKER_BASE_RETRY_MS: ${WORKER_BASE_RETRY_MS:-1000}
  WORKER_MAX_RETRY_MS: ${WORKER_MAX_RETRY_MS:-300000}
  WORKER_COMMAND_TIMEOUT_SECONDS: ${WORKER_COMMAND_TIMEOUT_SECONDS:-30}
  AGENTIC_WORKFLOW_INTERVAL_SECONDS: ${AGENTIC_WORKFLOW_INTERVAL_SECONDS:-300}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
  OPENROUTER_DOCUMENT_MODEL: ${OPENROUTER_DOCUMENT_MODEL:-qwen/qwen3.7-flash}
  OPENROUTER_TRANSCRIPTION_MODEL: ${OPENROUTER_TRANSCRIPTION_MODEL:-openai/whisper-large-v3}
  OPENROUTER_APP_URL: http://localhost:${WEB_PORT:-3000}
  OPENROUTER_APP_NAME: Aster Student Portal
  OPENROUTER_DOCUMENT_TIMEOUT_MS: ${OPENROUTER_DOCUMENT_TIMEOUT_MS:-120000}
  OPENROUTER_DOCUMENT_MAX_TOKENS: ${OPENROUTER_DOCUMENT_MAX_TOKENS:-6000}
  OPENROUTER_DOCUMENT_REASONING_TOKENS: ${OPENROUTER_DOCUMENT_REASONING_TOKENS:-256}
  EDWARD_E2E_MALICIOUS_PROVIDER_ENABLED: ${EDWARD_E2E_MALICIOUS_PROVIDER_ENABLED:-true}
  TRANSCRIPT_PARSING: ${TRANSCRIPT_PARSING:-openrouter}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
  GROQ_TRANSCRIPT_TIMEOUT_MS: ${GROQ_TRANSCRIPT_TIMEOUT_MS:-60000}
  GROQ_TRANSCRIPT_MAX_TOKENS: ${GROQ_TRANSCRIPT_MAX_TOKENS:-1400}
  GROQ_TRANSCRIPT_MAX_TEXT_CHARACTERS: ${GROQ_TRANSCRIPT_MAX_TEXT_CHARACTERS:-40000}
  GROQ_TRANSCRIPT_REASONING_EFFORT: ${GROQ_TRANSCRIPT_REASONING_EFFORT:-none}

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vv_enrollment}
      POSTGRES_USER: ${POSTGRES_USER:-vv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vv_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - vv-local

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vv_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vv_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vv-local

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set none "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vv_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vv_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-vv-documents}
    networks:
      - vv-local

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/vv_keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-vv}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-vv_local_password}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "${KEYCLOAK_HEALTH_PORT:-9002}:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - vv-local

  mailpit:
    image: axllent/mailpit:v1.25.1
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - vv-local

  migrate:
    <<: *python-service
    restart: "no"
    command:
      - audentra-migrate
      - --migrations-dir
      - /workspace/apps/api/migrations
    environment:
      <<: *runtime-environment
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vv-local

  seed:
    <<: *python-service
    restart: "no"
    command:
      - audentra-seed
      - --all
    environment:
      <<: *runtime-environment
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - vv-local

  api:
    <<: *python-service
    restart: unless-stopped
    command:
      - audentra-api
    environment: *runtime-environment
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - vv-local

  worker:
    <<: *python-service
    restart: unless-stopped
    command:
      - audentra-worker
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - vv-local

volumes:
  postgres-data:
  minio-data:
  mailpit-data:

networks:
  vv-local:
    driver: bridge
