apiVersion: batch/v1
kind: Job
metadata:
  generateName: audentra-platform-migrate-
  labels:
    app.kubernetes.io/name: audentra-platform
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: audentra
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audentra-platform
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: audentra
    spec:
      restartPolicy: OnFailure
      serviceAccountName: audentra-platform
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/audentra/audentra-platform:replace-me
          imagePullPolicy: IfNotPresent
          command: [audentra-migrate, --migrations-dir, /app/migrations]
          envFrom:
            - configMapRef:
                name: audentra-platform-config
            - secretRef:
                name: audentra-platform-runtime
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
