apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audentra-platform-api-ingress
  labels:
    app.kubernetes.io/name: audentra-platform
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audentra-platform
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: http
