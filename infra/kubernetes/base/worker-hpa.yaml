apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audentra-platform-worker
  labels:
    app.kubernetes.io/name: audentra-platform
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audentra-platform-worker
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
