apiVersion: apps/v1
kind: Deployment
metadata:
  name: audentra-platform-worker
  labels:
    app.kubernetes.io/name: audentra-platform
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: audentra
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audentra-platform
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audentra-platform
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: audentra
    spec:
      serviceAccountName: audentra-platform
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/audentra/audentra-platform:replace-me
          imagePullPolicy: IfNotPresent
          command: [audentra-worker]
          envFrom:
            - configMapRef:
                name: audentra-platform-config
            - secretRef:
                name: audentra-platform-runtime
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
