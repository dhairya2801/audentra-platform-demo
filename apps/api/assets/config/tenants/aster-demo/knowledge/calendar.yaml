schema_version: 1
tenant: aster-demo
configuration: academic_calendar
# Dated entries for 2026–2027. Times are America/New_York; a missing time
# means "the whole day" (deadlines end at 23:59). `audience` narrows who the
# entry is for; `owner_office` is a code from offices.yaml; `document` is the
# knowledge document that explains the entry.
