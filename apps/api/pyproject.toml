[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "audentra-platform-api"
version = "0.1.0"
description = "Framework-neutral Audentra application core with a FastAPI HTTP adapter"
requires-python = ">=3.11,<3.14"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.43,<2",
  "fastapi>=0.120,<1",
  "google-auth>=2.43,<3",
  "google-cloud-storage>=3.8,<4",
  "httpx>=0.28,<1",
  "livekit-api>=1.2.0",
  "opentelemetry-api>=1.39,<2",
  "pillow>=11,<13",
  "pyjwt[crypto]>=2.10,<3",
  "pymupdf==1.28.0",
  "python-multipart>=0.0.22,<1",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
audentra-api = "audentra.interfaces.http.main:run"
audentra-eval-api = "audentra.bootstrap.eval_api:main"
audentra-migrate = "audentra.infrastructure.db.migrations:main"
audentra-seed = "audentra.infrastructure.seeding.cli:run"
audentra-worker = "audentra.interfaces.worker.main:run"

[tool.hatch.build]
exclude = [
  "/.coverage*",
  "/.mypy-cache*",
  "/.mypy_cache",
  "/.pytest-*",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/build-artifacts",
  "/coverage*.xml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audentra"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "postgres: opt-in integration test requiring TEST_DATABASE_URL",
  "integration: opt-in external service integration test",
]

[tool.coverage.run]
branch = true
source = ["audentra"]

[tool.coverage.report]
fail_under = 67
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
